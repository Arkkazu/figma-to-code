name: audit

# すべてのブランチと pull request で `tools/run-checks.mjs` を実行する。
#
# verify-and-merge.yml は `claude/**` と `codex/**` と master でしか動かない。
# `fix/**` などそれ以外のブランチは、push しても何も検査されないまま残る。
# ここはその穴だけを塞ぐ。自動マージはしない。
#
# 検査集合の正本は `tools/run-checks.mjs` の CHECKS だけとする。
# このYAMLへ検査を直接並べない（2箇所に書くと必ず乖離する）。
#
# 背景（2026-09-01 実測）: 案件テーマの pre-commit hook は `.git/hooks/` にだけ在り、
# core.hooksPath 未設定・追跡下にも無いため **clone には残らない**。
# クラウドセッションは hook も CI も無い状態で clone するため、
# CI が無いと検査を通らない変更が正本へ入る。
#
# runner には上位層（C:\AI\vault / C:\AI\web-development）が無く、
# WORKFLOW.md「クラウドセッションでの実行範囲」と同じ cloud-restricted 条件で動く。
# そのため rule-size-audit（上位層に在る）と、入口5文書のうち
# web-development/WORKFLOW.md の1件は **ここでは検査されない**。
# CI が緑でも未検査なので、ローカルで通してから push すること（WORKFLOW.md「検査と反映」）。
#
# branch protection / required check の有効化はリポジトリ設定の変更であり、
# オーナーの判断事項なのでこのファイルでは行わない。有効化するまで、
# このworkflowは「落ちたことが見える」だけで merge を止めない。

on:
  push:
  pull_request:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # figma-gate.e2e は git worktree を作る。浅い clone だと落ちる。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # E2E が commit / worktree を作るため identity が要る。
      - name: configure git identity
        run: |
          git config --global user.email "audit@ci.invalid"
          git config --global user.name "figma-to-code audit"
          git config --global init.defaultBranch main

      # 判定が cloud-restricted であることを、暗黙にせず先に出力しておく。
      - name: environment verdict
        run: node tools/workflow-preflight.mjs

      - name: run repository checks
        run: node tools/run-checks.mjs
