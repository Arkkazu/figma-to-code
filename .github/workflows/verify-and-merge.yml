# claude/** と codex/** への push で検査を実行し、緑なら master へ自動マージする。
# PRを都度作らずに変更を反映するための仕組み。赤ならマージしないので、
# master には検査を通った変更だけが入る。
name: verify-and-merge

on:
  push:
    branches:
      - "claude/**"
      - "codex/**"
      - master

permissions:
  contents: write

concurrency:
  group: verify-and-merge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: run repository checks
        run: node tools/run-checks.mjs

  merge:
    needs: verify
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master
      - name: merge the verified commit into master
        env:
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          set -eu
          branch="${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # verify job が検査したのは push された ${VERIFIED_SHA} であって、ブランチの
          # 「今の先端」ではない。2026-09-06 まで origin/${branch} を取り直してマージして
          # いたため、検査の後に同じブランチへ push されたcommitが、一度も検査されないまま
          # master へ入る経路があった。マージ対象を検査済みSHAに固定して塞ぐ。
          git fetch origin "${branch}"
          # force-push などで検査済みSHAが到達不能になっていたら、黙って先端を
          # マージせずに落とす。未検査の内容をmasterへ入れないことを優先する。
          git cat-file -e "${VERIFIED_SHA}^{commit}"
          if git merge-base --is-ancestor "${VERIFIED_SHA}" HEAD; then
            echo "master already contains ${VERIFIED_SHA}; nothing to merge."
            exit 0
          fi
          git merge --no-ff --no-edit "${VERIFIED_SHA}" \
            -m "auto-merge ${branch}@${VERIFIED_SHA} (verified by tools/run-checks.mjs)"
          git push origin master
